org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# API the debug build talks to: the local backend (`cd backend && npm run dev`), which uses the
# development database. 10.0.2.2 is the emulator's alias for this computer. Release builds always use production.
# On a real phone run `adb reverse tcp:3006 tcp:3006` and override with http://localhost:3006/api/v1/
chartshop.debugApiBaseUrl=http://10.0.2.2:3006/api/v1/
